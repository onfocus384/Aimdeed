name: Aimdeed CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ─────────────────────────────────────────────────────────────
  # STAGE 1: Code Quality — DeepSource (runs via GitHub App)
  # No job needed here. DeepSource detects the .deepsource.toml
  # and automatically posts quality reports on every PR.
  # ─────────────────────────────────────────────────────────────

  # ─────────────────────────────────────────────────────────────
  # STAGE 2: Dependency Security — Dependabot (built into GitHub)
  # Configured via .github/dependabot.yml
  # Dependabot automatically opens PRs for vulnerable/outdated
  # packages — no job needed in this workflow.
  # ─────────────────────────────────────────────────────────────

  # ─────────────────────────────────────────────────────────────
  # STAGE 3: CI Tests — GitHub Actions
  # ─────────────────────────────────────────────────────────────
  build-and-test:
    name: 🧪 CI Tests (Node 18.x / 20.x)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify app starts successfully
        run: |
          timeout 10s node app.js || CODE=$?
          if [ "$CODE" = "124" ]; then
            echo "✅ App started successfully (timed out as expected in test)"
          else
            echo "❌ App failed to start with exit code $CODE"
            exit 1
          fi
        env:
          NODE_ENV: test
          PORT: 3000
          MONGO_URL: mongodb://127.0.0.1:27017/aimdeed_test
          SESSION_SECRET: ci-test-secret

  # ─────────────────────────────────────────────────────────────
  # STAGE 4: Docker Build Verification
  # ─────────────────────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker Build Verification
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aimdeed-app:${{ github.sha }} .

      - name: Verify image was created
        run: docker image inspect aimdeed-app:${{ github.sha }}

  # ─────────────────────────────────────────────────────────────
  # STAGE 5: Deployment Summary
  # Render auto-deploys on push to main via GitHub integration
  # ─────────────────────────────────────────────────────────────
  deployment-summary:
    name: 🚀 Deployment Summary
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Pipeline Complete
        run: |
          echo "╔═══════════════════════════════════════════════╗"
          echo "║        AIMDEED CI/CD PIPELINE COMPLETE        ║"
          echo "╠═══════════════════════════════════════════════╣"
          echo "║  🔍 DeepSource   → Code quality checked       ║"
          echo "║  🤖 Dependabot   → Dependencies secured       ║"
          echo "║  🧪 GitHub CI    → Tests passed               ║"
          echo "║  🐳 Docker       → Image verified             ║"
          echo "║  🚀 Render       → Auto-deploying...          ║"
          echo "╚═══════════════════════════════════════════════╝"
