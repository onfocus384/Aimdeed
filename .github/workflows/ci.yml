name: Aimdeed CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ─────────────────────────────────────────────────────────────
  # Code Quality + Dependency Security
  # DeepSource (via .deepsource.toml) and Dependabot (via
  # .github/dependabot.yml) run automatically — no jobs needed.
  # ─────────────────────────────────────────────────────────────

  # ─────────────────────────────────────────────────────────────
  # CI: install, unit + integration tests, build frontend
  # ─────────────────────────────────────────────────────────────
  test:
    name: Tests (Node 22)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run unit tests
        run: npm run test:unit --prefix backend
        env:
          NODE_ENV: test

      - name: Run integration tests (Redis-backed)
        run: npm run test:integration --prefix backend
        env:
          NODE_ENV: test
          REDIS_URL: redis://127.0.0.1:6379
          REDIS_PREFIX: aimdeed-ci

      - name: Build frontend production bundle
        run: npm run build --prefix frontend
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-key-for-ci

  # ─────────────────────────────────────────────────────────────
  # Docker: build images + boot full stack + run e2e suite
  # ─────────────────────────────────────────────────────────────
  docker:
    name: Docker stack + e2e
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -t aimdeed-backend:ci .
          docker build -t aimdeed-nginx:ci -f Dockerfile.nginx .

      - name: Boot stack (3 backend replicas + nginx + redis)
        run: |
          cp backend/.env.example backend/.env.production
          docker compose up -d --scale backend=3
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1/healthz >/dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1/healthz || (docker compose logs; exit 1)

      - name: Run e2e suite against stack
        run: npm run test:e2e --prefix backend
        env:
          E2E_BASE_URL: http://127.0.0.1

      - name: Print stack logs on failure
        if: failure()
        run: docker compose logs

  # ─────────────────────────────────────────────────────────────
  # Deployment summary (push to main/master)
  # ─────────────────────────────────────────────────────────────
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Pipeline Complete
        run: |
          echo "╔═══════════════════════════════════════════════╗"
          echo "║        AIMDEED CI/CD PIPELINE COMPLETE        ║"
          echo "╠═══════════════════════════════════════════════╣"
          echo "║  🔍 DeepSource   → Code quality checked       ║"
          echo "║  🤖 Dependabot   → Dependencies secured       ║"
          echo "║  🧪 Unit+Intg   → ${GITHUB_SHA::7} passed     ║"
          echo "║  🐳 Docker+e2e   → Stack verified             ║"
          echo "║  🚀 Deploy       → Auto-deploying...          ║"
          echo "╚═══════════════════════════════════════════════╝"
