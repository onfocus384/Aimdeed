name: Aimdeed Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ─────────────────────────────────────────────
  # STEP 1: Code Quality Check (DeepSource)
  # DeepSource runs automatically via its GitHub App
  # once .deepsource.toml is present in the repo.
  # No explicit job needed here — it reports on the PR.
  # ─────────────────────────────────────────────

  # ─────────────────────────────────────────────
  # STEP 2: Security Scan (Snyk)
  # ─────────────────────────────────────────────
  snyk-security:
    name: 🔒 Snyk Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true   # Report issues but don't block the pipeline
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  # ─────────────────────────────────────────────
  # STEP 3: GitHub Actions Tests
  # ─────────────────────────────────────────────
  build-and-test:
    name: 🧪 Build & Test (Node 18.x / 20.x)
    runs-on: ubuntu-latest
    needs: snyk-security

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Uncomment when you add tests:
      # - name: Run Tests
      #   run: npm test

      - name: Verify application starts
        run: |
          timeout 10s node app.js || CODE=$?
          if [ "$CODE" = "124" ]; then
            echo "✅ App started successfully (timeout as expected)"
          else
            echo "❌ App failed to start with code $CODE"
            exit 1
          fi
        env:
          NODE_ENV: test
          PORT: 3000
          MONGO_URL: mongodb://127.0.0.1:27017/aimdeed_test
          SESSION_SECRET: test-secret

  # ─────────────────────────────────────────────
  # STEP 4: Docker Build Validation
  # ─────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker Image Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aimdeed-app:ci-${{ github.sha }} .

  # ─────────────────────────────────────────────
  # STEP 5: Notify — Render deploys automatically
  # on merge via its GitHub integration
  # ─────────────────────────────────────────────
  deployment-ready:
    name: 🚀 Ready for Deployment
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Deployment Status
        run: |
          echo "==========================================="
          echo "✅ All checks passed!"
          echo ""
          echo "Pipeline completed:"
          echo "  🔍 DeepSource   → Code quality checked (via GitHub App)"
          echo "  🔒 Snyk         → Security scan complete"
          echo "  🧪 Tests        → Build verified on Node 18.x & 20.x"
          echo "  🐳 Docker       → Image built successfully"
          echo "  🚀 Render       → Detecting push & deploying automatically..."
          echo "==========================================="
