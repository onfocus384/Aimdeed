# Aimdeed production reverse proxy
# - Serves built SPA (frontend/dist) + static assets (backend/public) with long-lived caching
# - Load balances /api across N backend instances (least_conn + keepalive)
# - Global rate limiting zones
# - Request size limits, timeouts, X-Forwarded-* headers
# - TLS termination (documented; enable in production)

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # JSON-friendly access log with request id + upstream timing
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'req_id="$http_x_request_id" upstream="$upstream_addr" '
                  'upstream_time=$upstream_response_time request_time=$request_time';

  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log warn;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;

  # ---- Compression ----
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript
             application/xml application/rss+xml image/svg+xml
             application/x-javascript text/javascript;

  # ---- Global rate limiting zones (per client IP) ----
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=api_strict:10m rate=2r/s;

  # ---- Upstream backend pool ----
  # With `docker compose up --scale backend=N`, the service name resolves to
  # every replica's IP and nginx balances across all of them.
  upstream aimdeed_backend {
    least_conn;
    server backend:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    # =====================================================================
    # TLS termination (PRODUCTION)
    # Mount certs at /etc/nginx/certs/ and uncomment:
    #
    #   listen 443 ssl http2;
    #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #   ssl_protocols TLSv1.2 TLSv1.3;
    #   ssl_prefer_server_ciphers off;
    #   ssl_session_cache shared:SSL:10m;
    #   ssl_session_timeout 10m;
    #
    #   if ($scheme != "https") { return 301 https://$host$request_uri; }
    # =====================================================================

    # Request body size limit (1 MB — the app never sends larger bodies)
    client_max_body_size 1m;

    # ---- Built SPA assets: long-lived immutable cache ----
    location /assets/ {
      alias /usr/share/nginx/html/assets/;
      gzip_static on;
      expires 1y;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    # ---- Static asset directories served straight from disk ----
    # images/, people/, Books/, css/, js/, favicon_io/ come from backend/public
    location ~* ^/(images|people|Books|css|js|favicon_io)/ {
      root /usr/share/nginx/html;
      gzip_static on;
      expires 30d;
      add_header Cache-Control "public";
      access_log off;
    }

    location = /favicon.ico {
      root /usr/share/nginx/html;
      expires 30d;
      access_log off;
    }

    # ---- SPA: html + client-side routing deep links ----
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
    }

    # ---- API: load-balanced proxy to backend instances ----
    location /api/ {
      limit_req zone=api_general burst=60 nodelay;

      proxy_pass http://aimdeed_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";          # required for upstream keepalive
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;

      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;

      proxy_buffering on;
      proxy_buffer_size 4k;
      proxy_buffers 8 4k;

      # /api/josaa PUT replaces the full ~3 MB dataset; everything else stays tiny.
      client_max_body_size 10m;
    }

    # ---- Health endpoints: bypass app-level rate limits, still load balanced ----
    location = /healthz { proxy_pass http://aimdeed_backend; }
    location = /health  { proxy_pass http://aimdeed_backend; }
    location = /ready   { proxy_pass http://aimdeed_backend; }

    # Default deny for dotfiles / backups
    location ~ /\. { deny all; }
  }
}
